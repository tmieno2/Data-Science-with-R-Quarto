<!--
  Support for collapsible "Transcript" panels in revealjs decks.

  Include it from a deck's YAML header, with the path relative to the qmd:

      format:
        revealjs:
          include-in-header: ../transcript-support.html

  Then add a transcript anywhere inside a slide (or inside a single tab of a
  tabset, which is the usual case):

      <details class="transcript">
      <summary>Transcript</summary>

      What the lecturer says about this tab.

      </details>

  It must live in the header rather than the body of a qmd: raw HTML placed
  above the first "##" heading becomes its own untitled slide.

  <details> is a native HTML element, so the collapse/expand works with no
  JavaScript at all, including in a self-contained (embed-resources) file. The
  script at the bottom adds one behaviour on top: collapsing an open panel when
  the reader moves on. Without it everything still works, panels just keep their
  open state.
-->
<style>
/* The panel is positioned against the slide rather than sitting in its normal
   flow. That is the whole point: collapsed it costs the slide no vertical
   space, and opened it overlays the content instead of pushing it off the
   bottom edge. Each panel lives inside its own tab, and hidden tabs do not
   render, so only the visible tab's transcript is ever shown. */
.reveal details.transcript {
  position: absolute;
  top: 0;
  right: 0;
  z-index: 20;
  width: auto;
  font-size: 0.55em;
  line-height: 1.45;
  text-align: left;
  border-radius: 6px;
  /* custom.scss styles every bare <details> as an "answer box" (grey border
     plus padding) for Quarto's folded-code blocks. Opt out of both here so the
     collapsed pill is not sitting inside a grey rectangle. */
  border: none;
  padding: 0;
}

/* Collapsed: a small pill that hugs the top-right corner. */
.reveal details.transcript > summary {
  display: inline-block;
  cursor: pointer;
  list-style: none;
  outline: none;
  /* custom.scss pulls every bare <summary> with a negative margin; undo it. */
  margin: 0;
  padding: 0.15em 0.7em;
  border: 1px solid #06a666;
  border-radius: 999px;
  background: #ffffff;
  color: #06a666;
  font-weight: 600;
  white-space: nowrap;
  -webkit-user-select: none;
  user-select: none;
}
.reveal details.transcript > summary::-webkit-details-marker { display: none; }
.reveal details.transcript > summary::before { content: "\25B8\00A0"; }
.reveal details.transcript[open] > summary::before { content: "\25BE\00A0"; }

/* Opened: a tall, narrow panel down the right-hand side, where slide content
   rarely reaches. It starts below the tab bar (which ends at 16.4% of slide
   height on the busiest slide in 02-2) so tab names stay clickable while a
   transcript is open, and runs down to just above the footer. */
.reveal details.transcript[open] {
  top: 17%;
  width: 36%;
  max-height: 79%;
  overflow-y: auto;
  padding: 0.55em 0.85em 0.7em;
  background: #f4fbf8;
  border: 1px solid #06a666;
  box-shadow: 0 6px 22px rgba(0, 0, 0, 0.16);
}
.reveal details.transcript[open] > summary {
  display: block;
  padding: 0 0 0.4em 0;
  border: none;
  border-radius: 0;
  background: transparent;
}
.reveal details.transcript p { margin: 0.35em 0; }

/* The logo defaults to the bottom-right, exactly where the transcript panel
   runs. Move it to the bottom-left so the whole right-hand column stays free.
   The 56px offset clears reveal's menu button, which occupies x 8-43px. */
.reveal .slide-logo {
  right: auto !important;
  left: 56px !important;
}
</style>

<script>
// Collapse any open transcript when the reader moves to another slide or
// another tab, so a panel left open never reappears over unrelated content.
(function () {
  function closeAll() {
    document.querySelectorAll("details.transcript[open]")
      .forEach(function (d) { d.open = false; });
  }

  // Slide changes come from reveal, which is not ready when this runs.
  function hookReveal() {
    if (window.Reveal && typeof Reveal.on === "function") {
      Reveal.on("slidechanged", closeAll);
      Reveal.on("overviewshown", closeAll);
      return true;
    }
    return false;
  }
  if (!hookReveal()) {
    var tries = 0;
    var timer = setInterval(function () {
      if (hookReveal() || ++tries > 100) clearInterval(timer);
    }, 100);
  }

  // Tab changes are plain clicks; capture so this runs before the tab switches.
  document.addEventListener("click", function (e) {
    var el = e.target;
    if (el && el.closest && el.closest('.panel-tabset [role="tab"]')) closeAll();
  }, true);
})();
</script>
