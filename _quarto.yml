project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "!assignments/"
    - "!sample-project/"
    - "!lectures/Chapter-0/logistics.qmd"
    - "!lectures/Chapter-4-Data-Visualization/04-4-Misc.qmd"
    - "!lectures/Chapter-8-Table/test-quarto-live-table.qmd"
    # The AI appendix is a draft and is not on the website yet. An excluded deck
    # cannot be rendered on its own either, because outside the project the
    # `webr` filter no longer resolves. To preview: comment this line out,
    # render, then restore it and do BOTH of these, or the appendix stays on
    # the site:
    #   rm -rf docs/lectures/Appendix-2-AI
    #   quarto render lectures/index.qmd     # rebuilds the listing without it
    # That second step is not optional. Rendering any deck in the folder also
    # rebuilds lectures/index.qmd, which then carries links to all three.
    - "!lectures/Appendix-2-AI/"
    - "!sample-project-reproducible/code/main/*.qmd"
    - "!sample-project-reproducible/writing/*.qmd"
    # - "!lectures/Chapter-8-Table/08-2-modelsummary.qmd"
    - "!templates/"
  # Measure what every WebR cell prints, before the render, so the side-by-side
  # layout is decided from the real output. Only decks whose .qmd is newer than
  # their .js are re-measured, so this costs nothing on an unchanged render.
  pre-render:
    - lectures/measure-webr-output.R
  # Measured output sizes for the WebR cells, written by
  # _lecture-shared/measure-webr-output.R and read at load by webr-layout.html.
  # Without this they are not copied into the site and every cell falls back to
  # judging its layout on the code alone.
  resources:
    - "lectures/**/*.webr-output.js"
    # The AI appendix is unpublished, so nothing from it belongs in docs/.
    # Without this the glob above copies its measurement file into the site.
    - "!lectures/Appendix-2-AI/**"

website:
  title: "Data Science with R (AECN 896-05)"
  open-graph: true # https://quarto.org/docs/websites/website-tools.html#open-graph
  page-footer: "Made with Quarto"
  navbar:
    right:
      - text: Syllabus
        href: syllabus/syllabus_26.qmd
      - text: Calendar
        href: syllabus/calendar_26.qmd
      - text: Lecture Notes
        href: lectures/index.qmd
      - text: Assignments
        href: assignments.qmd
      - text: Exercises
        href: exercises/index.qmd
      # - text: Slides
      #   menu:
      #     - text: 01 - Univariate Regression
      #       href: lectures/univariate/univariate_regression_x.rmd
format:
  html:
    html-math-method:
      method: katex
      url: "https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/"
    mainfont: sans-serif
    # monofont: system-ui
    # fontsize: 24px
    # linestretch: # space between lines
    # max-width:
    page-layout: full
    theme: [cosmo, styles.scss]
